# Alembic 設定ファイル

[alembic]
# マイグレーションスクリプトの場所
script_location = alembic

# ファイル名テンプレート（デフォルト: %%(rev)s_%%(slug)s）
# file_template = %%(rev)s_%%(slug)s

# タイムゾーン（デフォルト: UTC）
# timezone =

# バージョンファイルの先頭に追加するインデント
# truncate_slug_length = 40

# Alembic はこのディレクトリを sys.path に追加する
prepend_sys_path = .

# バージョンファイルのパス区切り文字
# version_path_separator = os  # Use os.pathsep. Default configuration used for new projects.

# .env から動的に設定するため空にする
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
